name: Build Kernel (maple_dsds + ReSukiSU)

# 给 Sony Xperia XZ Premium (G8142 / maple_dsds) 编 LineageOS 22.1 内核。
# 一次 run 编两个变体（并行）：
#   ksu   = 带 ReSukiSU 35257（manual hook，已关闭 preinit）
#   noksu = 纯 Lineage 内核（对照组，用来判断问题出在工具链还是 KSU）
# 产物都是 AnyKernel3 包，TWRP 直接刷，失败可回滚 boot 分区备份。

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: 'ReSukiSU 内核源码版本（分支 / tag / commit）'
        required: false
        default: 'main'
      defconfig:
        description: 'defconfig 名称'
        required: false
        default: 'lineage-msm8998-yoshino-maple_dsds_defconfig'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        variant: [ksu, noksu]

    steps:
      - name: 拉取内核源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev rsync zip unzip python3 cpio

      - name: 下载 LineageOS 官方工具链
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/tc"
          git clone --depth 1 -q https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b "$GITHUB_WORKSPACE/tc/clang"
          git clone --depth 1 -q https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 "$GITHUB_WORKSPACE/tc/gcc64"
          git clone --depth 1 -q https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 "$GITHUB_WORKSPACE/tc/gcc32" || echo "警告：gcc32 拉取失败，仅影响 32 位兼容层"
          "$GITHUB_WORKSPACE/tc/clang/bin/clang" --version | head -1

      - name: 集成 ReSukiSU 内核补丁
        if: matrix.variant == 'ksu'
        run: |
          set -e
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s "${{ inputs.ksu_ref }}"
          ls -l drivers/kernelsu
          grep -rn "KSU_VERSION" KernelSU/kernel/ 2>/dev/null | head -5 || true

      # 上一版刷进去无限重启，最可能死在 preinit：
      # 它会把 PID 1 的 /system/bin/init 替换成内核里内嵌的 runner，
      # 一旦 runner 在 4.4 上起不来，init 直接死 -> 内核 panic -> 5 秒后自动重启（正好是无限重启）。
      # 关掉它不影响 root，只是模块挂载时机晚一点。
      - name: 关闭 preinit（Linux 4.4 兼容）
        if: matrix.variant == 'ksu'
        run: |
          set -e
          F=KernelSU/kernel/preinit/preinit.c
          grep -n "static bool ksu_preinit_enabled" "$F"
          sed -i 's/static bool ksu_preinit_enabled = true;/static bool ksu_preinit_enabled = false;/' "$F"
          grep -n "static bool ksu_preinit_enabled" "$F"
          if grep -q "ksu_preinit_enabled = true" "$F"; then
            echo "!!! preinit 没有关掉，停止"; exit 1
          fi

      - name: 打 manual hook 补丁（Non-GKI 必须）
        if: matrix.variant == 'ksu'
        run: |
          set -e
          python3 .github/scripts/patch_manual_hook.py "$GITHUB_WORKSPACE"
          echo "--- 校验 4 个 hook 已就位 ---"
          grep -c "ksu_handle_stat\|ksu_handle_newfstat_ret\|ksu_handle_fstat64_ret" fs/stat.c
          grep -c "ksu_handle_execveat\|ksu_handle_post_execveat" fs/exec.c
          grep -c "ksu_handle_faccessat" fs/open.c
          grep -c "ksu_handle_sys_reboot" kernel/reboot.c

      - name: 配置内核
        run: |
          set -e
          export PATH="$GITHUB_WORKSPACE/tc/clang/bin:$GITHUB_WORKSPACE/tc/gcc64/bin:$GITHUB_WORKSPACE/tc/gcc32/bin:$PATH"
          make O=out ARCH=arm64 "${{ inputs.defconfig }}"
          if [ "${{ matrix.variant }}" = "ksu" ]; then
            ./scripts/config --file out/.config \
              -d KSU_TRACEPOINT_HOOK \
              -e KSU_MANUAL_HOOK \
              -e KSU_MANUAL_HOOK_AUTO_SETUID_HOOK \
              -e KSU_MANUAL_HOOK_AUTO_INITRC_HOOK \
              -e KSU_MANUAL_HOOK_AUTO_INPUT_HOOK \
              -e KSU
          fi
          ./scripts/config --file out/.config -e KPROBES -e KALLSYMS -e KALLSYMS_ALL
          make O=out ARCH=arm64 olddefconfig
          echo "--- 确认关键配置 ---"
          grep -E "^CONFIG_(KSU|KSU_MANUAL_HOOK|KSU_TRACEPOINT_HOOK|KPROBES|KALLSYMS|MODULES|OVERLAY_FS)=" out/.config || true
          if [ "${{ matrix.variant }}" = "ksu" ] && ! grep -q "^CONFIG_KSU_MANUAL_HOOK=y" out/.config; then
            echo "!!! CONFIG_KSU_MANUAL_HOOK 没生效，停止"; exit 1
          fi
          cp out/.config ".config-${{ matrix.variant }}"

      - name: 编译 Image
        run: |
          set -e
          export PATH="$GITHUB_WORKSPACE/tc/clang/bin:$GITHUB_WORKSPACE/tc/gcc64/bin:$GITHUB_WORKSPACE/tc/gcc32/bin:$PATH"
          make -j"$(nproc)" O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$GITHUB_WORKSPACE/tc/gcc64/bin/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/tc/gcc32/bin/arm-linux-androideabi-" \
            LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            KCFLAGS="-Wno-error -Wno-deprecated-declarations" \
            HOSTCFLAGS="-Wno-error -Wno-deprecated-declarations" \
            Image
          ls -lh out/arch/arm64/boot/Image
          strings out/arch/arm64/boot/Image | grep -m1 "Linux version" || true
          strings out/arch/arm64/boot/Image | grep -m3 -i "ReSukiSU\|KernelSU" || true

      - name: 打包 AnyKernel3 刷机包
        run: |
          set -e
          cp out/arch/arm64/boot/Image anykernel3/Image
          if [ "${{ matrix.variant }}" = "ksu" ]; then
            ZIP=ReSukiSU-kernel-maple_dsds-35257.zip
          else
            ZIP=lineage-kernel-maple_dsds-plain.zip
          fi
          cd anykernel3
          zip -r9 "../$ZIP" . -x "*.git*" > /dev/null
          cd ..
          ls -lh "$ZIP"
          unzip -l "$ZIP" | head -12

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.variant }}
          path: |
            ReSukiSU-kernel-maple_dsds-35257.zip
            lineage-kernel-maple_dsds-plain.zip
            out/arch/arm64/boot/Image
            .config-${{ matrix.variant }}
          if-no-files-found: warn
